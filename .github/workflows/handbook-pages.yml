# Publishes comp-xtal/ (under repo root) as a static site (index.html + assets).
# Repo: Settings → Pages → Source: GitHub Actions

name: Deploy handbook to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r comp-xtal/requirements.txt

      - name: Build HTML from Markdown
        run: python3 comp-xtal/build_handbook.py build

      - name: Stage static assets for Pages
        run: |
          mkdir -p _site
          cp comp-xtal/index.html comp-xtal/styles.css comp-xtal/search.js _site/
          if [ -d comp-xtal/images ]; then cp -R comp-xtal/images _site/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
